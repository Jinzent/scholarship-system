<!DOCTYPE html>
<html>
<head>
    <title>Submit Message</title>
</head>
<body>
    <h1>Submit Inquiry or Complaint</h1>

    {% if messages %}
        {% for message in messages %}
            <p><strong>{{ message }}</strong></p>
        {% endfor %}
    {% endif %}

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

    <hr>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
