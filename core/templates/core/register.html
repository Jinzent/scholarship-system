<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>
    <h1>Student Registration</h1>

    <form method="POST">
        {% csrf_token %}
        
        <h2>Account Information</h2>
        {{ user_form.as_p }}

        <h2>Student Profile</h2>
        {{ profile_form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</body>
</html>
